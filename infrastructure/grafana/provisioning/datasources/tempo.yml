apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: TEMPO_DS
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:

      # === Service Graph ===
      serviceMap:                                   # Интеграция с Service Graph
        datasourceUid: PROMETHEUS_DS
      nodeGraph:
        enabled: true                               # Включает граф зависимостей. Визуализация Service Graph

      # === Корреляция трейсов → логов ===
      tracesToLogsV2:
        datasourceUid: LOKI_DS
        tags:
          - key: "service.name"
            value: "service"
          - key: "trace_id"
          - key: "custom_status"  # ← Ваш кастомный тег
            value: "custom_status"
        filterByTraceID: true                       # Включает фильтрацию по trace_id. При нажатии «Show logs**» Grafana автоматически добавляет условие trace_id="..." в запрос
        customQuery: true                           # Вместо тяжёлого запроса для поиска логов (пример внизу) будет лёгкий: {trace_id="9ea4b5b223cdd084c26391eb07114362"}
        query: '{trace_id="$${__trace.traceId}"}'
        spanStartTimeShift: "-5m"                   # Сдвигает назад начало временного окна логов от времени начала спана
        spanEndTimeShift: "5m"                      # Сдвигает вперёд конец временного окна логов от времени окончания спана. Чтобы захватить логи, которые появляются после завершения трейса

      # === Корреляция трейсов → метрик ===
      tracesToMetrics:                              # Маппинг тегов трейса → лейблов Prometheus
        datasourceUid: PROMETHEUS_DS
        tags:
          - key: "service.name"
            value: "service"

      # === UI Features ===
      streamingEnabled:                             # Включает streaming. Что даёт: 1. быстрее поиск трейсов 2. меньше нагрузка на UI
        search: true
        metrics: true
      traceQuery:                                   # Настройки временных сдвигов для запросов
        timeShiftEnabled: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
      search:                                       # Настройки поиска (Grafana -> Explore -> Tempo -> Search)
        hide: false                                 # hide: false — показывать панель поиска
      spanBar:                                      # Чтобы видеть HTTP path в водопаде
        type: "Tag"
        tag: "http.url"

# Docs: https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/provision/
# Docs: https://grafana.com/docs/grafana/latest/datasources/tempo/?spm=a2ty_o01.29997173.0.0.4e0f55fbcClUf9#configuration

#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  | apiVersion: 1                   | Версия формата конфигурации provisioning-файлов Grafana.                                      |
#  |                                 | 1 — текущая и единственная поддерживаемая версия для datasource provisioning.                 |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  | - name: Tempo                   | Имя источника данных в интерфейсе Grafana. Отображается в выпадающих списках (например,       |
#  |                                 | в Explore → Datasource). Может быть любым, но лучше использовать осмысленное имя.             |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  |   type: tempo                   | Тип datasource — указывает, что используется Grafana Tempo для трассировок.                   |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  |   uid: TEMPO_DS                 | Каждый datasource имеет уникальный uid.                                                       |
#  |                                 | Grafana использует uid для внутренней идентификации — дубликаты запрещены                     |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  |   access: proxy                 | Определяет, как Grafana взаимодействует с Tempo:                                              |
#  |                                 | proxy — запросы идут через бэкенд Grafana (рекомендуется для безопасности и CORS).            |
#  |                                 | direct — браузер клиента напрямую обращается к Tempo (требует CORS и доступности Tempo извне).|
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  |   url: http://tempo:4318        | Внутренний адрес Tempo в Docker-сети (порт 4318 — HTTP/OTLP). tempo — имя сервиса в           |
#  |                                 | docker-compose.yml. Это не клиентский URL, а внутрисетевой адрес между контейнерами.          |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  |   isDefault: true               | Делает этот источник данных выбранным по умолчанию в Explore.                                 |
#  |                                 | Удобно, если работать в основном с трассировками.                                             |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
#  |   jsonData:                     | Блок дополнительных настроек, специфичных для Tempo.                                          |
#  |                                 |                                                                                               |
#  |     serviceMapDataSourceUid: "" | UID другого datasource (обычно Prometheus), который содержит метрики сервисной карты.         |
#  |                                 | Если оставить пустым ("") — функция Service Map будет отключена. Для базовой трассировки      |
#  |                                 | это не нужно. Service Map — это визуализация взаимодействий между сервисами на основе метрик  |
#  |                                 | (не трассировок).                                                                             |
#  |                                 |                                                                                               |
#  |                                 | При serviceMapDataSourceUid: "PROMETHEUS_DS"                                                  |
#  |                                 |   - Отображает граф взаимодействий между сервисами (кто кого вызывает),                       |
#  |                                 |   - Показывает частоту вызовов, ошибки, латенси между нодами,                                 |
#  |                                 |   - Использует метрики из Prometheus, а не трассировки.                                       |
#  |                                 | Без этой настройки видно только отдельные трейсы, но не общую карту архитектуры.              |
#  |                                 | В Grafana: Explore → Tempo → вкладка "Service Graph".                                         |
#  |                                 |                                                                                               |
#  |     tracesToLogsV2:             | Результат: В Grafana: Trace → кнопка "Logs for this trace"                                    |
#  |       tags:                     |                                                                                               |
#  |        - key: "service.name"    | application.yml → management.opentelemetry.resource-attributes.service.name: ...              |
#  |          value: "service"       | Надо для: корреляции трейсов ↔ логи                                                           |
#  |                                 |                                                                                               |
#  |    filterByTraceID: true        | Включает фильтрацию по trace_id.                                                              |
#  |                                 | При нажатии «Show logs**» Grafana автоматически добавляет условие trace_id="..." в запрос     |
#  |                                 |                                                                                               |
#  |    spanStartTimeShift: "-1h"    | Сдвигает начало временного окна логов на 1 час назад от времени начала спана. Зачем?          |
#  |                                 | Иногда логи генерируются до начала трейса (например, инициализация библиотек), и без          |
#  |                                 | сдвига их можно пропустить. Рекомендация: Для DEV можно оставить -1h, для PROD — -5m.         |
#  |                                 |                                                                                               |
#  |    spanEndTimeShift: "1h"       | Сдвигает конец временного окна логов на 1 час вперёд от времени окончания спана               |
#  |                                 | Чтобы захватить логи, которые появляются после завершения трейса (например, асинхронные       |
#  |                                 | задачи, фоновые операции). Рекомендация: Аналогично — -5m для PROD.                           |
#  |                                 |                                                                                               |
#  |    streamingEnabled:            | Включает streaming (важно для новых Tempo). Что даёт:                                         |
#  |      search: true               |    - быстрее поиск трейсов                                                                    |
#  |      metrics: true              |    - меньше нагрузка на UI                                                                    |
#  |                                 |                                                                                               |
#  |    tracesToMetrics:             | Что делает: из trace → метрики                                                                |
#  |     datasourceUid: PROMETHEUS_DS| Пример: открыл trace, нажал → “View metrics”                                                  |
#  |                                 |                                                                                               |
#  |    nodeGraph:                   | Визуализация service graph                                                                    |
#  |      enabled: true              |                                                                                               |
#  |                                 |                                                                                               |
#  |    traceQuery:                  | Позволяет двигать временной диапазон (можно добавить, но не критично)                         |
#  |      timeShiftEnabled: true     |                                                                                               |
#  |                                 |                                                                                               |
#  |    customQuery: true            | Вместо тяжёлого запроса: {service="..."} | label_format log_line_contains_trace_id={{         |
#  |      query: '...'               | {{ contains "9ea4b5b223cdd084c26391eb07114362" __line__ }} |                                  |
#  |                                 | log_line_contains_trace_id="true" or trace_id="9ea4b5b223cdd084c26391eb07114362"              |
#  |                                 | Будет: {trace_id="9ea4b5b223cdd084c26391eb07114362"}                                          |
#  |                                 |                                                                                               |
#  +---------------------------------+-----------------------------------------------------------------------------------------------+
