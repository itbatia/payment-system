groups:
  - name: latency-alerts  # 95% всех HTTP-запросов за последние 5 минут выполняются дольше 1 секунды
    rules:
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, 
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service_name)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "Service {{ $labels.service_name }} latency is high"

  - name: tracing-alerts  # latency из traces, а не HTTP метрик
    rules:
      - alert: HighTraceLatency
        expr: |
          histogram_quantile(0.95, 
            sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le, service_name)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High trace latency"
          description: "Service {{ $labels.service_name }} is slow"

  - name: tracing-errors  # Алерт, если какой-то сервис падает
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
          by (service_name)
          /
          sum(rate(traces_spanmetrics_calls_total[5m]))
          by (service_name)
          > 0.05
        for: 2m
        labels:
          severity: critical
