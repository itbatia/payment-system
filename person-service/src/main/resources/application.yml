# ==================================================================================================================== #
# BASE config                                                                                                          #
# ==================================================================================================================== #
server:
  port: ${SERVER_PORT}

info:
  application:
    name: ${project.name}
    version: ${project.version}
    description: ${project.description}

logging:
  level:
    by.itbatia.psp.personservice.filter.OtelStatusWebFilter: ${LOG_LEVEL_WEB_FILTER}

# ==================================================================================================================== #
# SPRING config                                                                                                        #
# ==================================================================================================================== #
spring:
  application:
    name: ${info.application.name}
  datasource:
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}
  jpa:
    show-sql: ${SQL_LOGGING_ENABLED}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect   # Optional.
        format_sql: true                                   # Beautiful SQL formatting in logs.
  flyway:
    enabled: ${FLYWAY_ENABLED}
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration

# ==================================================================================================================== #
# METRICS + OPENTELEMETRY config                                                                                       #
# ==================================================================================================================== #
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true                         # Включает bucket'ы для HTTP-метрик
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_METRICS_EXPORT_ENABLED}
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED}
        batch-size: ${OTLP_METRICS_EXPORT_BATCH_SIZE}
        url: ${OTLP_METRICS_EXPORT_URL}
        step: ${OTLP_METRICS_EXPORT_STEP}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACING_EXPORT_OTLP_ENDPOINT}
          transport: ${OTEL_TRACING_EXPORT_OTLP_PROTOCOL}
    resource-attributes:
      service.name: ${info.application.name}
  tracing:
    export:
      enabled: ${OTEL_TRACING_EXPORT_ENABLED}
    propagation:
      type: ${OTEL_TRACING_PROPAGATION_TYPE}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY}
