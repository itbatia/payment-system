# ==================================================================================================================== #
# BASE config                                                                                                          #
# ==================================================================================================================== #
server:
  port: ${SERVER_PORT}

info:
  application:
    name: ${project.name}
    version: ${project.version}
    description: ${project.description}

# ==================================================================================================================== #
# SPRING config                                                                                                        #
# ==================================================================================================================== #
spring:
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/psp
  jpa:
    show-sql: true                                        # Enable SQL logging.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect  # Optional.
        format_sql: true                                  # Beautiful SQL formatting in logs.
      jdbc:
        time_zone: Europe/Minsk                           # Set up a time zone.
  flyway:
    enabled: true                                         # Enable migrations (by default true).
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration

# ==================================================================================================================== #
# METRICS config                                                                                                       #
# ==================================================================================================================== #
management:
  prometheus:
    metrics:
      export:
        enabled: ${EXPORT_METRICS_ENABLED}
  endpoints:
    web:
      exposure:
        include: prometheus, health
  endpoint:
    health:
      show-details: ALWAYS
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}